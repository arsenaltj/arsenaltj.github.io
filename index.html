<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="3D 作品档案：从创作图像到可下载的三维模型。"><title>形之档案 | 3D 作品</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
:root{--ink:#19231f;--paper:#f3f0e9;--line:#d2d5ca;--accent:#b4472b;--olive:#67715b;font-family:'DM Sans','Noto Sans SC',sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}body{margin:0}a{color:inherit}header{padding:22px clamp(20px,5vw,80px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:700;letter-spacing:.14em;font-size:15px;text-decoration:none}.topnote{font-size:12px;letter-spacing:.12em;color:var(--olive)}.hero{padding:clamp(55px,9vw,120px) clamp(20px,5vw,80px) 62px;position:relative;overflow:hidden}.hero:after{content:'';position:absolute;right:-8vw;top:-14vw;width:42vw;height:42vw;border:1px solid #c6c9bc;border-radius:50%;box-shadow:0 0 0 6vw #e8e7de,0 0 0 6.05vw #c6c9bc;pointer-events:none}.eyebrow{text-transform:uppercase;letter-spacing:.26em;font-size:12px;color:var(--accent);font-weight:700}.hero h1{font-size:clamp(48px,9vw,130px);line-height:1.02;letter-spacing:-.075em;margin:20px 0 22px;max-width:1000px}.hero p{max-width:580px;font-size:clamp(15px,1.5vw,19px);line-height:1.8;color:#4d5b50}.hero b{color:var(--ink)}main{padding:0 clamp(20px,5vw,80px) 100px}.rule{border-top:1px solid var(--ink);padding:18px 0 26px;display:flex;justify-content:space-between;gap:15px;font-size:12px;letter-spacing:.15em;text-transform:uppercase}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.controls button{border:1px solid var(--line);background:transparent;border-radius:0;padding:10px 17px;font:inherit;font-size:13px;cursor:pointer}.controls button.active{background:var(--ink);color:white;border-color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(13px,2vw,28px)}article{min-width:0}article .frame{aspect-ratio:1/1;background:#dddcd3;overflow:hidden;position:relative}article img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}article:hover img{transform:scale(1.05)}.number{position:absolute;top:12px;left:12px;background:var(--paper);padding:7px 10px;font-size:11px;letter-spacing:.12em}.cardline{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:17px 0 28px;border-top:1px solid var(--ink)}h2{font-size:clamp(18px,2vw,25px);margin:0 0 5px;letter-spacing:-.03em}small{font-size:12px;color:var(--olive)}.download{font-size:12px;text-decoration:none;border-bottom:1px solid var(--accent);color:var(--accent);white-space:nowrap;padding:4px 0}.download.disabled{color:#8b9286;border-color:#aeb4a9;cursor:default}footer{border-top:1px solid var(--line);padding:27px clamp(20px,5vw,80px);font-size:12px;color:var(--olive);display:flex;justify-content:space-between;gap:14px}#status{font-weight:600}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero:after{opacity:.35}}@media(max-width:580px){.grid{grid-template-columns:1fr}.hero:after{display:none}footer{display:block}.topnote{display:none}}@media(prefers-reduced-motion:reduce){article img{transition:none}}
</style></head><body><header><a class="brand" href="./">形之档案 / FORM ARCHIVE</a><span class="topnote">DIGITAL OBJECT COLLECTION</span></header>
<section class="hero"><div class="eyebrow">Selected Works / 2026</div><h1>让想象<br>成为形状。</h1><p>一组从文字和图像出发的三维创作。浏览作品，查看可下载的模型文件。<b>原件由创作者的本机提供；主机关机或连接中断时，下载会暂时停止。</b></p></section>
<main><div class="rule"><span>作品目录 / Collection</span><span id="total">正在载入…</span></div><div class="controls" role="group" aria-label="筛选作品"><button class="active" data-filter="全部">全部</button><button data-filter="图像创作">图像创作</button><button data-filter="文字创作">文字创作</button></div><div id="grid" class="grid" aria-live="polite"></div></main>
<footer><span>© 2026 形之档案 · 预览图在 GitHub Pages，模型由本机下载服务提供。</span><span id="status">正在检查模型下载连接…</span></footer>
<script>
const state={items:[],filter:'全部',base:null};
const grid=document.getElementById('grid');
function draw(){grid.replaceChildren();const items=state.items.filter(x=>state.filter==='全部'||x.category===state.filter);document.getElementById('total').textContent=state.filter==='全部'?`${state.items.length} works`:`${items.length} / ${state.items.length} works`;for(const [i,x] of items.entries()){const card=document.createElement('article');const frame=document.createElement('div');frame.className='frame';const img=document.createElement('img');img.src=x.image;img.alt=`${x.title}三维作品预览`;img.loading=i<3?'eager':'lazy';const number=document.createElement('span');number.className='number';number.textContent=x.title.toUpperCase();frame.append(img,number);const line=document.createElement('div');line.className='cardline';const text=document.createElement('div');const h=document.createElement('h2');h.textContent=x.title;const meta=document.createElement('small');meta.textContent=`${x.category} · ${x.format} · ${(x.bytes/1048576).toFixed(1)} MiB`;text.append(h,meta);const link=document.createElement('a');link.className='download'+(state.base?'':' disabled');link.textContent=state.base?'下载模型 ↗':'下载暂不可用';if(state.base){link.href=`${state.base}/models/${x.id}`;link.rel='noopener noreferrer'}else{link.setAttribute('aria-disabled','true')}line.append(text,link);card.append(frame,line);grid.append(card)}}
document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{state.filter=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===button));draw()}));
async function load(){try{const [catalog,endpoint]=await Promise.all([fetch('catalog.json'),fetch('endpoint.json',{cache:'no-store'})]);if(!catalog.ok||!endpoint.ok)throw Error('配置加载失败');state.items=await catalog.json();const config=await endpoint.json();if(typeof config.base_url==='string'&&/^https:\/\/[a-z0-9.-]+$/i.test(config.base_url))state.base=config.base_url.replace(/\/$/,'');draw();if(!state.base){document.getElementById('status').textContent='下载地址未配置';return}try{const health=await fetch(`${state.base}/health`,{cache:'no-store',signal:AbortSignal.timeout(10000)});document.getElementById('status').textContent=health.ok?'模型下载在线':'本机下载暂不可用，稍后重试'}catch(e){document.getElementById('status').textContent='下载状态未确认，可尝试下载'}}catch(e){document.getElementById('status').textContent='作品目录加载失败';draw()}}
load();
</script></body></html>
